  - type: Sprite
    sprite: Victoria_Stronghold/Tools/Basic/hammer.rsi
    state: icon
  - type: Item
    sprite: Victoria_Stronghold/Tools/Basic/hammer.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: StaminaDamageOnHit
    damage: 12 #have you ever been hit with a plastic bat? that shit hurts
  - type: Tool
    qualities:
    - Hammering

